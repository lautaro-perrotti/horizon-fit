<section class="hf-checkout-view" data-checkout-page hidden aria-label="Checkout">
  <div class="hf-checkout-view__intro">
    <h1 class="hf-checkout-view__title">Checkout</h1>
  </div>

  <template data-checkout-summary-template>
    <div class="hf-checkout-view__summary-content">
      <div class="hf-checkout-view__section-head">
        <span class="hf-checkout-view__section-kicker">Resumen</span>
        <strong class="hf-checkout-view__section-title">Tu pedido</strong>
      </div>

      <div class="hf-checkout-view__items" data-checkout-order-items></div>
      <p class="hf-checkout-view__empty" data-checkout-empty>Tu carrito está vacío. Volvé a la tienda para agregar productos.</p>

      <div class="hf-checkout-view__totals">
        <div><span>Subtotal</span><strong data-checkout-subtotal>$ 0,00</strong></div>
        <div><span>Envío</span><strong data-checkout-shipping>Se calcula después</strong></div>
        <div class="hf-checkout-view__totals-final"><span>Total</span><strong data-checkout-total>$ 0,00</strong></div>
      </div>

      <div class="hf-checkout-view__summary-links">
        <a class="btn btn--secondary" href="/">Seguir comprando</a>
      </div>
    </div>
  </template>

  <div class="hf-checkout-view__confirmation" data-checkout-confirmation hidden>
    <div class="hf-checkout-view__panel hf-checkout-view__confirmation-panel">
      <div class="hf-checkout-view__confirmation-mark" aria-hidden="true">✓</div>
      <span class="hf-checkout-view__section-kicker">Pedido confirmado</span>
      <h2>¡Gracias por tu compra!</h2>
      <p data-checkout-confirmation-message>Recibimos tu pedido y te enviamos el detalle por correo electrónico.</p>

      <div class="hf-checkout-view__confirmation-details">
        <div><span>Pedido</span><strong data-checkout-confirmation-number></strong></div>
        <div><span>Estado</span><strong data-checkout-confirmation-status></strong></div>
        <div><span>Medio de pago</span><strong data-checkout-confirmation-payment></strong></div>
        <div><span>Total</span><strong data-checkout-confirmation-total></strong></div>
      </div>

      <p class="hf-checkout-view__confirmation-account" data-checkout-confirmation-account hidden></p>
      <p class="hf-checkout-view__status" data-checkout-confirmation-error aria-live="polite"></p>

      <div class="hf-checkout-view__confirmation-actions">
        <a class="btn btn--primary" href="/">Seguir comprando</a>
        <a class="btn btn--secondary" href="/mi-cuenta/" data-checkout-confirmation-account-link hidden>Ver mi cuenta</a>
      </div>
    </div>
  </div>

  <div class="hf-checkout-view__mobile-summary">
    <button class="hf-checkout-view__mobile-summary-toggle" type="button" data-checkout-summary-toggle
      aria-expanded="true" aria-controls="checkoutMobileSummaryPanel">
      <span>
        Resumen del pedido
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m6 9 6 6 6-6"></path>
        </svg>
      </span>
      <strong data-checkout-mobile-total>$ 0,00</strong>
    </button>
    <div class="hf-checkout-view__mobile-summary-panel" id="checkoutMobileSummaryPanel"
      data-checkout-mobile-summary-panel></div>
  </div>

  <div class="hf-checkout-view__grid">
    <div class="hf-checkout-view__form-column">
      <form class="hf-checkout-view__panel hf-checkout-view__form" data-checkout-form>
        <div class="hf-checkout-view__section">
          <div class="hf-checkout-view__section-head">
            <span class="hf-checkout-view__section-kicker">Contacto</span>
          </div>
          <div class="hf-checkout-view__fields hf-checkout-view__contact-fields">
            <label class="hf-checkout-view__field">
              <span>Correo electrónico</span>
              <input data-checkout-field="billing.email" type="email" name="billing_email" autocomplete="email" required>
            </label>
          </div>
          <label class="hf-checkout-view__toggle hf-checkout-view__toggle--compact">
            <input type="checkbox" name="email_marketing" value="1">
            <span>Enviarme novedades y ofertas por correo electrónico</span>
          </label>
          <label class="hf-checkout-view__toggle hf-checkout-view__toggle--compact" data-checkout-create-account-row>
            <input data-checkout-create-account type="checkbox" name="create_account" value="1">
            <span>Crear una cuenta para futuras compras y obtené descuentos. Te enviaremos un correo para definir tu contraseña.</span>
          </label>
        </div>

        <div class="hf-checkout-view__section" data-checkout-delivery>
          <div class="hf-checkout-view__section-head">
            <span class="hf-checkout-view__section-kicker">Entrega</span>
          </div>
          <div class="hf-checkout-view__fields hf-checkout-view__address-fields" data-checkout-shipping-address-fields>
            <label class="hf-checkout-view__field hf-checkout-view__field--full">
              <span>País / Región</span>
              <select data-checkout-field="shipping.country" name="shipping_country" autocomplete="shipping country-name" required>
                <option value="AR" selected>Argentina</option>
              </select>
            </label>
            <label class="hf-checkout-view__field hf-checkout-view__field--half">
              <span>Nombre</span>
              <input data-checkout-field="shipping.first_name" type="text" name="shipping_first_name" autocomplete="shipping given-name" required>
            </label>
            <label class="hf-checkout-view__field hf-checkout-view__field--half">
              <span>Apellidos</span>
              <input data-checkout-field="shipping.last_name" type="text" name="shipping_last_name" autocomplete="shipping family-name" required>
            </label>
            <label class="hf-checkout-view__field hf-checkout-view__field--full">
              <span>DNI/CUIT/CUIL (solo números sin puntos ni guiones)</span>
              <input data-checkout-field="shipping.horizon-fit-commerce/dni" type="text" name="shipping_hf_dni" inputmode="numeric" pattern="[0-9]{7,11}" maxlength="11" autocomplete="off" required>
            </label>
            <label class="hf-checkout-view__field hf-checkout-view__field--full">
              <span>Dirección (calle y altura)</span>
              <input data-checkout-field="shipping.address_1" type="text" name="shipping_address_1" autocomplete="shipping address-line1" required>
            </label>
            <label class="hf-checkout-view__field hf-checkout-view__field--full">
              <span>Casa, departamento, etc. (opcional)</span>
              <input data-checkout-field="shipping.address_2" type="text" name="shipping_address_2" autocomplete="shipping address-line2">
            </label>
            <label class="hf-checkout-view__field hf-checkout-view__field--third">
              <span>Código postal</span>
              <input data-checkout-field="shipping.postcode" type="text" name="shipping_postcode" autocomplete="shipping postal-code" required>
            </label>
            <label class="hf-checkout-view__field hf-checkout-view__field--third">
              <span>Ciudad</span>
              <input data-checkout-field="shipping.city" type="text" name="shipping_city" autocomplete="shipping address-level2" required>
            </label>
            <label class="hf-checkout-view__field hf-checkout-view__field--third">
              <span>Provincia</span>
              <select data-checkout-field="shipping.state" name="shipping_state" autocomplete="shipping address-level1" required>
                <option value="B" selected>Buenos Aires</option>
                <option value="C">Ciudad Autónoma de Buenos Aires</option>
                <option value="K">Catamarca</option><option value="H">Chaco</option><option value="U">Chubut</option>
                <option value="X">Córdoba</option><option value="W">Corrientes</option><option value="E">Entre Ríos</option>
                <option value="P">Formosa</option><option value="Y">Jujuy</option><option value="L">La Pampa</option>
                <option value="F">La Rioja</option><option value="M">Mendoza</option><option value="N">Misiones</option>
                <option value="Q">Neuquén</option><option value="R">Río Negro</option><option value="A">Salta</option>
                <option value="J">San Juan</option><option value="D">San Luis</option><option value="Z">Santa Cruz</option>
                <option value="S">Santa Fe</option><option value="G">Santiago del Estero</option>
                <option value="V">Tierra del Fuego</option><option value="T">Tucumán</option>
              </select>
            </label>
            <label class="hf-checkout-view__field hf-checkout-view__field--full">
              <span>Teléfono</span>
              <input data-checkout-field="shipping.phone" type="tel" name="shipping_phone" autocomplete="shipping tel" required>
            </label>
          </div>
          <label class="hf-checkout-view__toggle">
            <input data-checkout-same-address type="checkbox" checked>
            <span>Usar la misma dirección para facturación</span>
          </label>
          <div class="hf-checkout-view__billing-fields" data-checkout-billing-fields hidden>
            <div class="hf-checkout-view__section-head">
              <strong class="hf-checkout-view__section-title">Facturación</strong>
            </div>
            <div class="hf-checkout-view__fields hf-checkout-view__address-fields">
            <label class="hf-checkout-view__field hf-checkout-view__field--full">
              <span>País / Región</span>
              <select data-checkout-field="billing.country" name="billing_country" autocomplete="billing country-name" required>
                <option value="AR" selected>Argentina</option>
              </select>
            </label>
            <label class="hf-checkout-view__field hf-checkout-view__field--half">
              <span>Nombre</span>
              <input data-checkout-field="billing.first_name" type="text" name="billing_first_name" autocomplete="billing given-name" required>
            </label>
            <label class="hf-checkout-view__field hf-checkout-view__field--half">
              <span>Apellidos</span>
              <input data-checkout-field="billing.last_name" type="text" name="billing_last_name" autocomplete="billing family-name" required>
            </label>
            <label class="hf-checkout-view__field hf-checkout-view__field--full">
              <span>DNI/CUIT/CUIL (solo números sin puntos ni guiones)</span>
              <input data-checkout-field="billing.horizon-fit-commerce/dni" type="text" name="billing_hf_dni" inputmode="numeric" pattern="[0-9]{7,11}" maxlength="11" autocomplete="off" required>
            </label>
            <label class="hf-checkout-view__field hf-checkout-view__field--full">
              <span>Dirección (calle y altura)</span>
              <input data-checkout-field="billing.address_1" type="text" name="billing_address_1" autocomplete="billing address-line1" required>
            </label>
            <label class="hf-checkout-view__field hf-checkout-view__field--full">
              <span>Casa, departamento, etc. (opcional)</span>
              <input data-checkout-field="billing.address_2" type="text" name="billing_address_2" autocomplete="billing address-line2">
            </label>
            <label class="hf-checkout-view__field hf-checkout-view__field--third">
              <span>Código postal</span>
              <input data-checkout-field="billing.postcode" type="text" name="billing_postcode" autocomplete="billing postal-code" required>
            </label>
            <label class="hf-checkout-view__field hf-checkout-view__field--third">
              <span>Ciudad</span>
              <input data-checkout-field="billing.city" type="text" name="billing_city" autocomplete="billing address-level2" required>
            </label>
            <label class="hf-checkout-view__field hf-checkout-view__field--third">
              <span>Provincia</span>
              <select data-checkout-field="billing.state" name="billing_state" autocomplete="billing address-level1" required>
                <option value="B" selected>Buenos Aires</option>
                <option value="C">Ciudad Autónoma de Buenos Aires</option>
                <option value="K">Catamarca</option><option value="H">Chaco</option><option value="U">Chubut</option>
                <option value="X">Córdoba</option><option value="W">Corrientes</option><option value="E">Entre Ríos</option>
                <option value="P">Formosa</option><option value="Y">Jujuy</option><option value="L">La Pampa</option>
                <option value="F">La Rioja</option><option value="M">Mendoza</option><option value="N">Misiones</option>
                <option value="Q">Neuquén</option><option value="R">Río Negro</option><option value="A">Salta</option>
                <option value="J">San Juan</option><option value="D">San Luis</option><option value="Z">Santa Cruz</option>
                <option value="S">Santa Fe</option><option value="G">Santiago del Estero</option>
                <option value="V">Tierra del Fuego</option><option value="T">Tucumán</option>
              </select>
            </label>
            <label class="hf-checkout-view__field hf-checkout-view__field--full">
              <span>Teléfono</span>
              <input data-checkout-field="billing.phone" type="tel" name="billing_phone" autocomplete="billing tel" required>
            </label>
            </div>
          </div>
        </div>

        <div class="hf-checkout-view__section">
          <div class="hf-checkout-view__section-head">
            <span class="hf-checkout-view__section-kicker">Pago</span>
            <strong class="hf-checkout-view__section-title">Método de pago</strong>
          </div>
          <input type="hidden" data-checkout-payment-method name="payment_method" value="">
          <div class="hf-checkout-view__payments" data-checkout-payment-methods></div>
          <label class="hf-checkout-view__field hf-checkout-view__notes">
            <span>Notas del pedido</span>
            <textarea name="order_notes" rows="4" placeholder="Indicaciones para la entrega o el pago"></textarea>
          </label>
          <button class="btn btn--primary hf-checkout-view__submit" data-checkout-submit type="submit">Finalizar compra</button>
          <p class="hf-checkout-view__status" data-checkout-status aria-live="polite"></p>
        </div>
      </form>

    </div>

    <aside class="hf-checkout-view__summary-rail" aria-label="Resumen del pedido">
      <div class="hf-checkout-view__panel hf-checkout-view__summary" data-checkout-desktop-summary></div>
    </aside>
  </div>
</section>
