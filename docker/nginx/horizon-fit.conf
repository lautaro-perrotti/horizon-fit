server {
    listen 80;
    listen [::]:80;
    server_name horizonfit.com.ar www.horizonfit.com.ar;
    return 301 https://horizonfit.com.ar$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.horizonfit.com.ar;
    return 301 https://api.horizonfit.com.ar$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.horizonfit.com.ar;

    ssl_certificate /etc/letsencrypt/live/horizonfit.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horizonfit.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://horizonfit.com.ar$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name horizonfit.com.ar;

    ssl_certificate /etc/letsencrypt/live/horizonfit.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horizonfit.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.horizonfit.com.ar;

    ssl_certificate /etc/letsencrypt/live/horizonfit.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horizonfit.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 256M;

    location / {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
    }
}
